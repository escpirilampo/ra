<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ESCPirilampo · Ciências</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23C2410C'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23FDE68A'/%3E%3C/svg%3E">
<style>
  :root { --fundo: #F6F4EF; --texto: #1B1D22; --suave: #5F6470; --linha: #E2DDD2; --laranja: #C2410C; --cena: #172235; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--fundo); color: var(--texto); font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; }
  body { min-height: 100svh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 10px; padding: calc(12px + env(safe-area-inset-top)) 16px 8px; font-weight: 700; font-size: 15px; }
  header i { width: 26px; height: 26px; border-radius: 8px; background: var(--laranja); display: inline-grid; place-items: center; }
  header i::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: #FDE68A; }
  header a { color: inherit; text-decoration: none; }
  main { flex: 1; display: flex; flex-direction: column; width: 100%; max-width: 760px; margin: 0 auto; }
  model-viewer { width: calc(100% - 24px); margin: 6px 12px 0; height: min(62svh, 560px); border-radius: 22px; background: radial-gradient(circle at 50% 40%, #24354f, #0e1625 75%); --poster-color: transparent; --progress-bar-color: #F59E0B; }
  .dica { position: absolute; left: 12px; bottom: 10px; color: #fff; font-size: 12px; opacity: .85; pointer-events: none; }
  .carga { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 15px; pointer-events: none; }
  h1 { margin: 14px 16px 2px; font-size: 23px; line-height: 1.2; }
  .sub { margin: 0 16px; color: var(--suave); font-style: italic; font-size: 14px; }
  .desc { margin: 10px 16px; font-size: 15px; line-height: 1.5; }
  .ar { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 14px 16px 8px; height: 58px; border: 0; border-radius: 16px; background: var(--laranja); color: #fff; font: 700 19px inherit; font-family: inherit; width: calc(100% - 32px); }
  .ar svg { width: 24px; height: 24px; }
  .sem-ar { margin: 10px 16px; padding: 12px 14px; border-radius: 12px; background: #FFF7ED; border: 1px solid #FED7AA; font-size: 14px; line-height: 1.4; }
  .sem-ar .copiar { margin-top: 10px; height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #FDBA74; background: #fff; font: 600 14px inherit; font-family: inherit; }
  .fonte { margin: 8px 16px calc(18px + env(safe-area-inset-bottom)); text-align: center; font-size: 11.5px; color: #8A8F99; line-height: 1.4; }
  .erro { margin: 40px 20px; text-align: center; line-height: 1.5; }
  /* Lista (página inicial) */
  .lista h2 { margin: 18px 16px 8px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--suave); }
  .lista a { display: flex; gap: 12px; align-items: center; margin: 0 12px 6px; padding: 10px; border-radius: 14px; background: #fff; border: 1px solid var(--linha); color: inherit; text-decoration: none; font-size: 15px; }
  .lista a img { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; background: var(--cena); flex: none; }
  .lista a span small { display: block; color: var(--suave); font-size: 12.5px; margin-top: 2px; }
  .procura { margin: 10px 12px 0; width: calc(100% - 24px); height: 46px; border-radius: 12px; border: 1px solid var(--linha); padding: 0 14px; font: 16px inherit; font-family: inherit; }

  /* Puxar o modelo para baixo não recarrega a página (telemóveis). */
  html, body { overscroll-behavior-y: none; }
  /* Corpo humano inteiro: sistemas, nomes e «Legendar» */
  .cena { position: relative; }
  .cena model-viewer { display: block; }
  .tg { position: absolute; right: 22px; bottom: 10px; display: flex; gap: 6px; }
  .tg button { height: 36px; padding: 0 14px; border-radius: 18px; border: 0; background: rgba(255,255,255,.93); font: 700 14px inherit; font-family: inherit; color: var(--texto); }
  .tg button[aria-pressed="true"] { background: var(--laranja); color: #fff; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 12px 0; }
  .chips button { height: 36px; padding: 0 12px; border-radius: 18px; border: 1.5px solid #D6D0C4; background: #fff; font: 600 14px inherit; font-family: inherit; color: var(--texto); display: inline-flex; align-items: center; gap: 6px; }
  .chips button[aria-pressed="true"] { border-color: var(--laranja); background: #FFF1E8; color: #9A3412; }
  .chips button[aria-pressed="true"]::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--laranja); }
  .etq { border: 0; padding: 0; background: none; width: 12px; height: 12px; position: relative; pointer-events: none; transition: opacity .2s; }
  .etq::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: #fff; border: 2.5px solid var(--laranja); box-sizing: border-box; }
  .etq span { position: absolute; top: 50%; transform: translateY(-50%); white-space: nowrap; background: rgba(255,255,255,.95); color: var(--texto); font: 600 12.5px "Segoe UI", system-ui, sans-serif; padding: 3px 8px; border-radius: 8px; box-shadow: 0 1px 5px rgba(0,0,0,.35); }
  .etq.d span { left: 17px; } .etq.e span { right: 17px; }
  .etq:not([data-visible]), .etq.tapa { opacity: 0; }
  .etq.ok::before { border-color: #16A34A; } .etq.ok span { border: 2px solid #16A34A; }
  .etq.toque::before { background: var(--laranja); border-color: #fff; }
  /* Pista do jogo: ao fim de 5 s sem tocar, uma peça por legendar acende (e um anel pulsa por cima). */
  .etq.pista { width: 22px; height: 22px; } .etq.pista span { display: none; }
  .etq.pista::before { background: rgba(249,115,22,.35); border: 3px solid var(--laranja); animation: pista 1.1s ease-in-out infinite; }
  @keyframes pista { 0%, 100% { transform: scale(.8); opacity: 1; } 50% { transform: scale(1.6); opacity: .45; } }
  .cartao { margin: 10px 12px 0; background: #fff; border: 1px solid var(--linha); border-radius: 16px; padding: 12px 14px; }
  .cartao b { font-size: 17px; } .cartao small { display: block; color: var(--suave); font-size: 13px; margin-top: 2px; }
  .cartao p { margin: 8px 0 0; font-size: 14px; line-height: 1.45; }
  .cartao .ac { display: flex; gap: 8px; margin-top: 10px; }
  .cartao .ac button, .folha .bt button { flex: 1; height: 42px; border-radius: 12px; border: 1.5px solid #D6D0C4; background: #fff; font: 600 14px inherit; font-family: inherit; color: var(--texto); }
  .estado { display: flex; align-items: center; justify-content: space-between; margin: 10px 16px 0; font-size: 15px; font-weight: 700; }
  .vidas { display: inline-flex; gap: 4px; align-items: center; }
  .hud { position: absolute; left: 50%; top: calc(14px + env(safe-area-inset-top)); transform: translateX(-50%); display: none; gap: 14px; align-items: center; padding: 8px 16px; border-radius: 20px; background: rgba(255,255,255,.94); font-weight: 700; font-size: 15px; box-shadow: 0 4px 14px rgba(0,0,0,.25); white-space: nowrap; }
  model-viewer[ar-status="session-started"] .hud, model-viewer[ar-status="object-placed"] .hud { display: flex; }
  model-viewer .aviso { top: calc(66px + env(safe-area-inset-top)); }
  .vidas svg { width: 24px; height: 24px; }
  .folha { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; max-width: 760px; margin: 0 auto; background: #fff; border-radius: 24px 24px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.2); padding: 12px 16px calc(18px + env(safe-area-inset-bottom)); }
  .folha .pega { width: 44px; height: 5px; border-radius: 3px; background: #D6D0C4; margin: 0 auto 10px; }
  .folha h4 { margin: 0; font-size: 17px; }
  .folha .op { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .folha .op button { min-height: 48px; padding: 4px 8px; border-radius: 12px; border: 1.5px solid #D6D0C4; background: #fff; font: 600 15px inherit; font-family: inherit; color: var(--texto); }
  .folha .op button[aria-pressed="true"] { border-color: var(--laranja); background: #FFF1E8; }
  .folha .bt { display: flex; gap: 8px; margin-top: 10px; }
  .folha .bt button { height: 48px; font-size: 15px; font-weight: 700; }
  .folha .bt .p { background: var(--laranja); border-color: var(--laranja); color: #fff; }
  .folha .bt .p:disabled { opacity: .45; }
  .aviso { position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top)); transform: translateX(-50%); z-index: 30; max-width: calc(100% - 32px); padding: 12px 18px; border-radius: 14px; background: #1B1D22; color: #fff; font-size: 15px; font-weight: 600; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
  .aviso.mal { background: #B91C1C; } .aviso.bem { background: #15803D; }
  .fim { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 20px; background: rgba(10,14,22,.78); }
  .fim > div { width: 100%; max-width: 420px; background: #fff; border-radius: 26px; padding: 26px 22px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .fim svg { width: 84px; height: 84px; }
  .fim h2 { margin: 10px 0 6px; font-size: 26px; line-height: 1.2; }
  .fim p { margin: 0 0 6px; font-size: 18px; line-height: 1.45; }
  .fim .grande { font-size: 21px; font-weight: 700; color: #15803D; margin: 12px 0; }
  .fim small { display: block; color: var(--suave); font-size: 14px; margin-top: 6px; }
  .fim button { margin-top: 16px; width: 100%; height: 54px; border: 0; border-radius: 16px; background: var(--laranja); color: #fff; font: 700 18px inherit; font-family: inherit; }
  .fim button.sec { background: #fff; color: var(--texto); border: 1.5px solid #D6D0C4; margin-top: 8px; }
</style>

<body>
<header><i aria-hidden="true"></i><a href="./">ESCPirilampo · Ciências</a></header>
<main id="m"></main>
<script>
// Página para ver os modelos da ferramenta de Ciências no telemóvel e em realidade aumentada (?m=categoria/id).
// Só mostra modelos: não tem contas, nem dados da escola, nem dos alunos.
(async function () {
  'use strict';
  const M = document.getElementById('m');
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const json = async (f) => { const r = await fetch(f, { cache: 'no-cache' }); if (!r.ok) throw new Error(f); return r.json(); };
  const CORPO_FONTE = 'Z-Anatomy, a partir do BodyParts3D (DBCLS) · CC BY-SA 4.0';
  const id = (new URLSearchParams(location.search).get('m') || '').replace(/[^a-z0-9\/-]/gi, '');
  const AR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4.5v9L12 20l-8-4.5v-9z"/><path d="M12 11l8-4.5M12 11v9M12 11L4 6.5"/></svg>';

  async function dados(id) {
    const p = id.split('/');
    if (p[0] === 'seres') { const d = (await json('seres.json'))[p[1]]; return d && { t: d.t, c: d.c, d: d.d, f: d.f, glb: 'm/seres/' + p[1] + '.glb', poster: 'm/seres/' + p[1] + '.jpg' }; }
    if (p[0] === 'virus') { const d = (await json('virus.json'))[p[1]]; return d && { t: d.t, c: d.c, d: d.d, f: d.f, glb: 'm/virus/' + p[1] + '.glb' }; }
    if (p[0] === 'corpo') {
      const C = await json('corpo.json');
      if (p[1] === 'g') { const g = C.grupos[p[2]]; return g && { t: g.pt, c: 'Corpo humano · ' + g.pecas + ' peças', f: CORPO_FONTE, glb: 'm/corpo/g/' + p[2] + '.glb' }; }
      if (p[1] === 'p') { const x = C.pecas[p[2]]; return x && { t: x.pt + (x.lado ? ' (' + x.lado + ')' : ''), c: 'Corpo humano · ' + (C.sistemas[x.sis] || {}).pt, d: x.d, f: CORPO_FONTE, glb: 'm/corpo/p/' + p[2] + '.glb' }; }
      const s = C.sistemas[p[1]]; return s && { t: 'Corpo humano · ' + s.pt, c: s.pecas + ' peças', f: CORPO_FONTE, glb: 'm/corpo/' + p[1] + '.glb' };
    }
    return null;
  }

  async function lista() {
    document.title = 'ESCPirilampo · Ciências';
    const [S, V, C] = await Promise.all([json('seres.json'), json('virus.json'), json('corpo.json')]);
    const item = (href, img, t, s) => '<a href="?m=' + href + '">' + (img ? '<img loading="lazy" alt="" src="' + img + '">' : '<img alt="">') + '<span>' + esc(t) + (s ? '<small>' + esc(s) + '</small>' : '') + '</span></a>';
    M.innerHTML = '<div class="lista"><input class="procura" type="search" placeholder="Procurar…" aria-label="Procurar">' +
      '<h2>Corpo humano</h2>' + item('corpo/inteiro', '', 'Corpo humano inteiro', 'Todos os sistemas · nomes das peças') + Object.keys(C.sistemas).map((k) => item('corpo/' + k, '', C.sistemas[k].pt, C.sistemas[k].pecas + ' peças')).join('') +
      Object.keys(C.grupos).map((k) => item('corpo/g/' + k, '', C.grupos[k].pt, 'Corpo humano')).join('') +
      '<h2>Seres vivos</h2>' + Object.keys(S).map((k) => item('seres/' + k, 'm/seres/' + k + '.jpg', S[k].t, S[k].c || S[k].g)).join('') +
      '<h2>Vírus</h2>' + Object.keys(V).map((k) => item('virus/' + k, '', V[k].t, V[k].c)).join('') + '</div>';
    M.querySelector('.procura').addEventListener('input', (e) => {
      const t = e.target.value.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
      M.querySelectorAll('.lista a').forEach((a) => { a.hidden = t && a.textContent.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').indexOf(t) < 0; });
    });
  }


  // ---------------------------------------------------------------------------------------------
  // Corpo humano inteiro (?m=corpo/inteiro): os 7 sistemas num só modelo, cada um liga e desliga;
  // «Nomes» mostra as legendas principais e tocar numa peça diz o nome. Com &leg=… (escolhido pelo
  // professor no quadro) é o jogo «Legendar»: o aluno toca numa peça e escolhe o nome; só pode errar
  // três vezes. Nada fica guardado nem é enviado.
  const VIDAS = 3;
  const NOMES_SIS = { esqueleto: 'Esqueleto', musculos: 'Músculos', circulatorio: 'Circulatório', nervoso: 'Nervoso', visceras: 'Órgãos', linfatico: 'Linfático', articulacoes: 'Articulações' };
  // Sistema «natural» de cada conjunto do jogo: os outros sistemas só mostram as peças do jogo.
  const SIS_CONJ = { ossos: 'esqueleto', orgaos: 'visceras', vasos: 'circulatorio', musculos: 'musculos', nervoso: 'nervoso', linfatico: 'linfatico' };
  const CORACAO = (cheio) => '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C1 8.6 3 5 6.6 5c2.1 0 3.6 1.2 4.4 2.6.8-1.4 2.3-2.6 4.4-2.6C19 5 21 8.6 19.6 11.8 17.5 16.4 12 21 12 21z" fill="' + (cheio ? '#DC2626' : 'none') + '" stroke="' + (cheio ? '#DC2626' : '#C9C3B8') + '" stroke-width="2"/></svg>';
  const TACA = '<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M20 8h24v14c0 8-5 14-12 14s-12-6-12-14z" fill="#FBBF24" stroke="#B45309" stroke-width="3" stroke-linejoin="round"/><path d="M20 13h-8c0 8 4 12 9 13M44 13h8c0 8-4 12-9 13" fill="none" stroke="#B45309" stroke-width="3" stroke-linecap="round"/><path d="M32 36v10M22 56h20l-3-10H25z" fill="#FBBF24" stroke="#B45309" stroke-width="3" stroke-linejoin="round"/></svg>';
  const PERDEU = '<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="26" fill="#FEE2E2" stroke="#DC2626" stroke-width="3"/><path d="M22 22l20 20M42 22L22 42" stroke="#DC2626" stroke-width="5" stroke-linecap="round"/></svg>';

  async function corpoInteiro(q) {
    const [C, I] = await Promise.all([json('corpo.json'), json('inteiro.json')]);
    const leg = (q.get('leg') || '').split(',').filter((a) => I.alvos[a]);
    const jogo = leg.length > 0;
    const titulo = jogo ? 'Legendar o corpo' : 'Corpo humano inteiro';
    document.title = titulo + ' · ESCPirilampo';
    M.innerHTML =
      '<h1 style="margin-top:4px">' + titulo + '</h1><p class="sub">' + (jogo ? 'Toque numa peça e escolha o nome' : 'Escolha os sistemas · toque numa peça para ver o nome') + '</p>' +
      (jogo ? '<div class="estado"><span class="conta"></span><span class="vidas" aria-label="Vidas"></span></div>' : '') +
      '<div class="cena"><model-viewer src="m/corpo/inteiro.glb" alt="Corpo humano" camera-controls touch-action="none" shadow-intensity="0" exposure="1.05" environment-image="neutral"' +
        ' min-camera-orbit="auto auto 0.2m" camera-orbit="0deg 82deg auto" disable-tap interpolation-decay="120"' +
        ' ar ar-modes="webxr scene-viewer quick-look" ar-scale="auto" ar-placement="floor" interaction-prompt="none">' +
        '<button slot="ar-button" class="ar" type="button">' + AR + 'Ver na sala</button>' +
        '<div class="carga" slot="progress-bar"></div>' + (jogo ? '<div class="hud"><span class="conta"></span><span class="vidas"></span></div>' : '') + '</model-viewer>' +
        (jogo ? '' : '<div class="tg"><button type="button" data-a="nomes" aria-pressed="false">Nomes</button></div>') + '</div>' +
      (jogo ? '' : '<div class="chips">' + I.sistemas.map((k) => '<button type="button" data-sis="' + k + '" aria-pressed="false">' + NOMES_SIS[k] + '</button>').join('') + '</div>') +
      (jogo ? '<p class="desc">Também pode jogar <b>na sala</b>: toque em «Ver na sala», ponha o corpo no chão e toque nas peças. Funciona no Android (Chrome); no iPhone o jogo faz-se aqui no ecrã.</p>' : '') +
      '<div class="cartao" hidden></div>' +
      '<div class="sem-ar" hidden></div>' +
      '<p class="fonte">' + esc(CORPO_FONTE) + '<br><a href="./">Ver todos os modelos</a></p>';
    const mv = M.querySelector('model-viewer'), cartao = M.querySelector('.cartao');
    const bt = mv.querySelector('.ar');
    const N = I.ids.length, idx = {}; I.ids.forEach((p, i) => { idx[p] = i; });
    const nomePeca = (gi) => { const x = C.pecas[I.ids[gi]] || {}; return (x.pt || '') + (x.lado ? ' (' + x.lado + ')' : ''); };
    const sisDe = (gi) => (C.pecas[I.ids[gi]] || {}).sis;
    // Sistemas ligados no início: os do jogo, ou esqueleto + órgãos + circulatório.
    const ligados = new Set();
    const escondidas = new Uint8Array(N);   // peças tiradas pelo aluno («Esconder», «Só esta peça»)
    const soJogo = new Set();               // sistemas que só mostram as peças do jogo
    if (jogo) {
      // No jogo só se veem as peças que o professor escolheu (o aluno não junta outras).
      leg.forEach((a) => { const x = I.alvos[a]; ligados.add(x.sis); soJogo.add(x.sis); });
    } else ['esqueleto', 'visceras', 'circulatorio'].forEach((k) => ligados.add(k));
    const doJogo = new Uint8Array(N); leg.forEach((a) => I.alvos[a].pecas.forEach((gi) => { doJogo[gi] = 1; }));

    let cena = null, malhas = [];
    function ligarCena() {
      const sym = Object.getOwnPropertySymbols(mv).find((s) => s.description === 'scene');
      cena = sym ? mv[sym] : null;
      if (!cena) return;
      malhas = [];
      cena.traverse((o) => {
        if (!o.isMesh || !o.geometry || !o.geometry.attributes._id) return;
        let p = o; while (p && !/^sis-/.test(p.name || '')) p = p.parent;
        malhas.push({ o, sis: p ? p.name.slice(4) : '', g0: o.geometry, ids: o.geometry.attributes._id.array });
      });
    }
    // Põe à vista o que deve estar: sistemas ligados e, neles, só as peças que não estão escondidas.
    // As peças escondidas saem mesmo da malha (fica mais leve para mostrar e para levar para a sala no iPhone).
    let estado = 0, prepararIOS = () => {};
    function aplicar() {
      if (!cena) return;
      estado++;
      for (const m of malhas) {
        const vis = ligados.has(m.sis);
        m.o.visible = vis;
        if (!vis) continue;
        const parcial = soJogo.has(m.sis), ids = m.ids;
        const fica = (g) => !(escondidas[g] || (parcial && !doJogo[g]));
        let todas = true;
        for (let v = 0; v < ids.length && todas; v++) if (!fica(ids[v])) todas = false;
        const antes = m.o.geometry;
        if (todas) m.o.geometry = m.g0;
        else {
          const g0 = m.g0, A = g0.attributes, ind = g0.index.array, novo = new Int32Array(ids.length).fill(-1);
          const P = A.position.array, Nn = A.normal ? A.normal.array : null, idx = [];
          let nv = 0;
          for (let t = 0; t < ind.length; t += 3) {
            const a = ind[t], b = ind[t + 1], c = ind[t + 2];
            if (!fica(ids[a]) || !fica(ids[b]) || !fica(ids[c])) continue;
            for (const v of [a, b, c]) { if (novo[v] < 0) novo[v] = nv++; idx.push(novo[v]); }
          }

    });
  }
    // Sem realidade aumentada: muitas vezes é por a página ter aberto dentro de outra app (leitor de QR, WhatsApp,
    // Google…). No iPhone só o Safari a faz; no Android, o Chrome.
    function semAR() {
      const caixa = M.querySelector('.sem-ar'), ua = navigator.userAgent;
      const ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
      const android = /Android/.test(ua);
      const outraApp = ios ? !/Safari\//.test(ua) || /CriOS|FxiOS|EdgiOS|GSA\/|FBAN|FBAV|Instagram|WhatsApp/.test(ua) : android && (/; wv\)|FBAN|FBAV|Instagram|WhatsApp|GSA\//.test(ua) || !/Chrome\//.test(ua));
      caixa.innerHTML = outraApp
        ? '<b>Para pôr o modelo na sala, abra esta página no ' + (ios ? 'Safari' : 'Chrome') + '.</b><br>' +
          (ios ? 'Toque em <b>Partilhar</b> (ou nos três pontos) e escolha «Abrir no Safari», ou leia o código QR com a app <b>Câmara</b> do iPhone.'
               : 'Toque nos três pontos e escolha «Abrir no Chrome», ou leia o código QR com a câmara do telemóvel.') +
          '<br><button type="button" class="copiar">Copiar o endereço</button>'
        : 'Este aparelho não consegue pôr o modelo na sala (realidade aumentada). Pode na mesma rodá-lo e aproximá-lo com os dedos.' +
          (android ? ' No Android, precisa da app «Google Play Services para RA» e do Chrome.' : '');
      caixa.hidden = false;
      const c = caixa.querySelector('.copiar');
      if (c) c.addEventListener('click', async () => { try { await navigator.clipboard.writeText(location.href); c.textContent = 'Endereço copiado'; } catch (e) { c.textContent = location.href; } });
    }

  try {
    if (!id) { await lista(); return; }
    if (id === 'corpo/inteiro') { await corpoInteiro(new URLSearchParams(location.search)); return; }
    const d = await dados(id);
    if (!d) { M.innerHTML = '<p class="erro">Este modelo não foi encontrado.<br><a href="./">Ver todos os modelos</a></p>'; return; }
    document.title = d.t + ' · ESCPirilampo';
    M.innerHTML =
      '<model-viewer src="' + esc(d.glb) + '"' + (d.poster ? ' poster="' + esc(d.poster) + '"' : '') + ' alt="' + esc(d.t) + '" camera-controls touch-action="pan-y" auto-rotate auto-rotate-delay="2500" rotation-per-second="18deg" shadow-intensity="1" exposure="1.05" environment-image="neutral"' +
        ' ar ar-modes="webxr scene-viewer quick-look" ar-scale="auto" ar-placement="floor" interaction-prompt="none">' +
        '<button slot="ar-button" class="ar" type="button">' + AR + 'Ver na sala</button>' +
        '<div class="carga" slot="progress-bar"></div>' +
        '<span class="dica">Arraste para rodar · dois dedos para aproximar</span></model-viewer>' +
      '<h1>' + esc(d.t) + '</h1>' + (d.c ? '<p class="sub">' + esc(d.c) + '</p>' : '') + (d.d ? '<p class="desc">' + esc(d.d) + '</p>' : '') +
      '<div class="sem-ar" hidden>Este aparelho não consegue pôr o modelo na sala (realidade aumentada). Pode na mesma rodá-lo e aproximá-lo com os dedos.</div>' +
      '<p class="fonte">' + esc(d.f) + '<br><a href="./">Ver todos os modelos</a></p>';
    const mv = M.querySelector('model-viewer');
    // O botão «Ver na sala» fica por baixo do modelo (mais fácil de tocar); só aparece se o aparelho tiver RA.
    const bt = mv.querySelector('.ar');
    mv.addEventListener('load', () => {
      if (mv.canActivateAR) { M.insertBefore(bt, mv.nextSibling); bt.addEventListener('click', () => mv.activateAR()); }
      else { bt.remove(); semAR(); }
    }, { once: true });
    mv.addEventListener('error', () => { M.insertAdjacentHTML('afterbegin', '<p class="erro">Não foi possível abrir o modelo. Verifique a ligação à internet.</p>'); });
    arAndroid(mv);
  } catch (e) {
    M.innerHTML = '<p class="erro">Não foi possível abrir a página. Verifique a ligação à internet.</p>';
  }
})();
</script>
</body>
</html>
